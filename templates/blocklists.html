{% extends "base.html" %}
{% block title %}Blocklists / Integrations{% endblock %}

{% block content %}
<div id="blocklist-content-container" class="panel-layout" style="grid-template-columns: 1fr;">
    <div class="loading-spinner"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        checkBlocklistStatus();
    });

    // Custom callback for global triggerSync
    function onSyncComplete(data) {
        checkBlocklistStatus();
    }

    function checkBlocklistStatus() {
        const container = document.getElementById("blocklist-content-container");
        if (!container) return;

        fetch("/api/metrics")
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.last_sync === "Never" || data.total_iocs === 0) {
                        // Render empty state
                        container.innerHTML = `
                            <div class="panel-card" style="width: 100%;">
                                <div class="empty-state-wrapper">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                                    <p>No blocklist files found — please run a sync first to generate blocklists.</p>
                                </div>
                            </div>
                        `;
                    } else {
                        // Render download grid
                        container.innerHTML = `
                            <div class="panel-card downloads-panel" style="width: 100%;">
                                <div class="panel-header">
                                    <h2>Defensive Integrations (Blocklists)</h2>
                                </div>
                                <div class="panel-body">
                                    <p class="panel-desc">Export normalized, correlated high/medium risk indicators directly into security gateways and sensors:</p>
                                    <div class="download-grid">
                                        <a href="/download/ips" class="download-btn color-firewall" id="btn-dl-ips">
                                            <span class="dl-badge">Firewall</span>
                                            <div class="dl-info">
                                                <h3>IP Address Blocklist</h3>
                                                <p>Plain txt file format</p>
                                            </div>
                                            <span class="dl-icon">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                            </span>
                                        </a>
                                        
                                        <a href="/download/domains_urls" class="download-btn color-dns" id="btn-dl-dns">
                                            <span class="dl-badge">Web Filters</span>
                                            <div class="dl-info">
                                                <h3>Domains & URLs</h3>
                                                <p>Structured CSV file format</p>
                                            </div>
                                            <span class="dl-icon">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                            </span>
                                        </a>

                                        <a href="/download/hashes" class="download-btn color-edr" id="btn-dl-av">
                                            <span class="dl-badge">Antivirus / EDR</span>
                                            <div class="dl-info">
                                                <h3>Malicious Hashes</h3>
                                                <p>MD5/SHA1/SHA256 CSV</p>
                                            </div>
                                            <span class="dl-icon">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                            </span>
                                        </a>

                                        <a href="/download/combined" class="download-btn color-siem" id="btn-dl-siem">
                                            <span class="dl-badge">SIEM / API</span>
                                            <div class="dl-info">
                                                <h3>Combined Threat Intel</h3>
                                                <p>Universal JSON schema</p>
                                            </div>
                                            <span class="dl-icon">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                            </span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }
            })
            .catch(err => {
                console.error("Error reading blocklist metrics:", err);
                container.innerHTML = `<div class="panel-card" style="width: 100%;"><p class="td-error">Failed to check blocklist availability status.</p></div>`;
            });
    }
</script>
{% endblock %}
